name: CopperScript example board

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  board:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install build tools
        run: |
          python -m pip install uv==0.13.0
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes make kicad
          test "$(kicad-cli version)" = "10.0.7"
      - name: Install pinned Rust compiler
        run: make install-compiler
      - name: Route, verify and export manufacturing files from locked URL dependencies
        timeout-minutes: 45
        run: |
          make
          kicad-cli version > build/kicad-version.txt
      - name: Retain native DRC diagnostics even after routing failure
        if: always()
        run: |
          if test -f build/board.kicad_pcb; then
            kicad-cli pcb drc --refill-zones --save-board --format json --severity-all -o build/drc.json build/board.kicad_pcb
          fi
      - name: Render the latest available draft even after routing failure
        if: always()
        run: |
          if test -f build/board.kicad_pcb; then make render; fi
      - name: Upload routing and build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CopperLedRing-inspection-${{ github.sha }}
          path: build/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload manufacturing files only after successful native DRC and BOM checks
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CopperLedRing-manufacturing-${{ github.sha }}
          path: build/manufacturing/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: board
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: CopperLedRing-manufacturing-${{ github.sha }}
          path: manufacturing
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: CopperLedRing-inspection-${{ github.sha }}
          path: inspection
      - name: Package all routing diagnostics and layer previews
        run: zip -r routing-inspection.zip inspection
      - name: Publish the tagged unprogrammed-hardware manufacturing package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" manufacturing/manufacturing-package.zip manufacturing/gerbers-drill.zip manufacturing/bom.csv manufacturing/cpl.csv manufacturing/manifest.json manufacturing/SHA256SUMS routing-inspection.zip \
            --title "CopperLedRing $TAG_NAME — manufacturing files" --prerelease \
            --notes "Fully routed, native KiCad DRC-clean unprogrammed hardware. Independent CAM qualification intentionally skipped. Includes Gerbers, drills, exact BOM, both-side CPL, PCB/project, reports and checksums. Check supplier stock, BOM matching and assembly preview before ordering. Firmware and CR2032 cell are not included."
