name: CopperScript example board

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  board:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Install build tools
        run: |
          python -m pip install uv==0.11.32
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes make kicad
          test "$(kicad-cli version)" = "10.0.6"
      - name: Build the inspection project from locked URL dependencies
        run: |
          make pcb render
          kicad-cli version > build/kicad-version.txt
          kicad-cli pcb drc --refill-zones --save-board --format json --severity-all -o build/inspection-drc.json build/board.kicad_pcb
      - name: Attempt the complete routing build
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: make
      - name: Render the latest available draft even after routing failure
        if: always()
        run: |
          if test -f build/board.kicad_pcb; then make render; fi
      - name: Upload inspection artifacts, never an order-ready release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CopperLedRing-inspection-${{ github.sha }}
          path: build/
          if-no-files-found: warn
          retention-days: 14
